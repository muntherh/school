# Local development only. Production hosting/secrets are configured separately.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sdms
      POSTGRES_PASSWORD: sdms
      POSTGRES_DB: sdms
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - sdms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sdms']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sdms_postgres:
